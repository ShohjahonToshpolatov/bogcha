version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bogcha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bogcha
      POSTGRES_PASSWORD: bogcha_dev_password
      POSTGRES_DB: bogcha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bogcha -d bogcha"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bogcha-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: bogcha-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bogcha_minio
      MINIO_ROOT_PASSWORD: bogcha_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: bogcha-mediamtx
    restart: unless-stopped
    environment:
      MTX_PROTOCOLS: tcp
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC
      - "9997:9997"   # API
    volumes:
      - ./docker/mediamtx/mediamtx.yml:/mediamtx.yml:ro

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: bogcha-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - /app/node_modules

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: bogcha-worker
    restart: unless-stopped
    command: node dist/jobs/main.js
    env_file:
      - ./api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: bogcha-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: bogcha-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
  minio_data:
