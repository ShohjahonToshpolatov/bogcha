<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JARVIS — Shaxsiy AI Yordamchi</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="h-screen w-screen overflow-hidden bg-[#09090b] text-zinc-100">

  <div id="app" class="flex h-full w-full relative">

    <!-- Mobil uchun qora fon (sidebar ochilganda) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden"></div>

    <!-- CHAP YON PANEL -->
    <aside id="sidebar"
      class="fixed md:static z-40 h-full w-[280px] shrink-0 -translate-x-full md:translate-x-0
             transition-transform duration-200 ease-out
             bg-[#0d0d10]/95 md:bg-[#0d0d10]/60 backdrop-blur-xl
             border-r border-white/[0.08] flex flex-col">

      <div class="p-4 border-b border-white/[0.08]">
        <button id="new-chat-btn"
          class="w-full flex items-center justify-center gap-2 rounded-xl
                 bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-400/30
                 text-cyan-300 font-medium py-2.5 px-4 transition-all duration-200
                 hover:shadow-[0_0_20px_rgba(6,182,212,0.25)]">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
          </svg>
          Yangi suhbat
        </button>
      </div>

      <div class="px-4 pt-4 pb-2">
        <label class="text-xs uppercase tracking-wider text-zinc-500 font-semibold">Provider</label>
        <select id="provider-select"
          class="mt-2 w-full bg-white/[0.04] border border-white/[0.08] rounded-lg px-3 py-2
                 text-sm text-zinc-200 focus:outline-none focus:border-cyan-400/50
                 focus:shadow-[0_0_0_3px_rgba(6,182,212,0.15)] transition-all duration-200">
          <option value="gemini">Gemini (asosiy)</option>
          <option value="groq">Groq (zaxira)</option>
          <option value="ollama">Ollama (lokal)</option>
        </select>
      </div>

      <div class="px-4 pt-3 pb-2 text-xs uppercase tracking-wider text-zinc-500 font-semibold">
        Suhbatlar tarixi
      </div>
      <div id="sessions-list" class="flex-1 overflow-y-auto px-2 pb-4 space-y-1"></div>

      <div class="p-4 border-t border-white/[0.08] text-xs text-zinc-500">
        JARVIS v1.0 &middot; 100% bepul
      </div>
    </aside>

    <!-- ASOSIY QISM -->
    <main class="flex-1 flex flex-col min-w-0 h-full">

      <!-- YUQORI PANEL -->
      <header class="h-16 shrink-0 flex items-center justify-between px-4 md:px-6
                     border-b border-white/[0.08] bg-[#09090b]/80 backdrop-blur-xl z-10">
        <div class="flex items-center gap-3">
          <button id="hamburger-btn" class="md:hidden text-zinc-300 p-1">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="w-9 h-9 rounded-lg bg-cyan-500/10 border border-cyan-400/30 flex items-center
                      justify-center shadow-[0_0_20px_rgba(6,182,212,0.2)]">
            <span class="text-cyan-300 font-bold text-sm">J</span>
          </div>
          <span class="font-bold tracking-wide text-zinc-100">JARVIS</span>
        </div>

        <div class="flex items-center gap-2 text-xs text-zinc-400">
          <span id="status-dot" class="w-2 h-2 rounded-full bg-red-500"></span>
          <span id="status-text">Tekshirilmoqda...</span>
        </div>
      </header>

      <!-- XATOLIK BANNERI -->
      <div id="error-banner" class="hidden mx-4 mt-3 md:mx-6 rounded-xl border border-red-500/30
                  bg-red-500/10 text-red-300 text-sm px-4 py-3 flex items-start justify-between gap-3">
        <span id="error-banner-text"></span>
        <button id="error-banner-close" class="text-red-300/70 hover:text-red-200 shrink-0">&times;</button>
      </div>

      <!-- XABARLAR OQIMI -->
      <div id="messages" class="flex-1 overflow-y-auto px-4 md:px-6 py-6 space-y-5">

        <!-- BO'SH HOLAT -->
        <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center gap-6">
          <div class="w-20 h-20 rounded-2xl bg-cyan-500/10 border border-cyan-400/30 flex items-center
                      justify-center shadow-[0_0_40px_rgba(6,182,212,0.2)]">
            <span class="text-cyan-300 font-extrabold text-3xl">J</span>
          </div>
          <div>
            <h1 class="text-xl font-bold text-zinc-100">Xush kelibsiz, Xo'jayin</h1>
            <p class="text-zinc-500 text-sm mt-1">Nima bilan yordam bera olaman?</p>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-lg">
            <button class="preset-btn suggestion-card">Node.js'da fayl o'qishni tushuntir</button>
            <button class="preset-btn suggestion-card">Bugungi kun uchun reja tuz</button>
            <button class="preset-btn suggestion-card">Python va JavaScript farqi nima?</button>
            <button class="preset-btn suggestion-card">Motivatsion gap ayt</button>
          </div>
        </div>
      </div>

      <!-- KIRITISH MAYDONI -->
      <div class="shrink-0 border-t border-white/[0.08] bg-[#09090b]/80 backdrop-blur-xl p-3 md:p-4">
        <div id="image-preview-wrap" hidden class="max-w-3xl mx-auto mb-2 flex items-center gap-2">
          <div class="relative">
            <img id="image-preview" class="h-16 w-16 object-cover rounded-lg border border-white/[0.12]" alt="Biriktirilgan rasm" />
            <button type="button" id="image-preview-remove" title="Olib tashlash"
              class="absolute -top-2 -right-2 w-5 h-5 rounded-full bg-red-500 text-white text-xs leading-5 text-center">&times;</button>
          </div>
          <span class="text-xs text-zinc-500">Rasm biriktirildi</span>
        </div>
        <form id="chat-form" class="max-w-3xl mx-auto flex items-end gap-2
                    bg-white/[0.04] border border-white/[0.08] rounded-2xl p-2
                    focus-within:border-cyan-400/40 focus-within:shadow-[0_0_25px_rgba(6,182,212,0.15)]
                    transition-all duration-200">

          <input type="file" id="image-input" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
          <button type="button" id="image-attach-btn" title="Rasm biriktirish"
            class="shrink-0 w-10 h-10 rounded-xl flex items-center justify-center text-zinc-400
                   hover:text-cyan-300 hover:bg-white/[0.06] transition-all duration-200">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button type="button" id="voice-mode-btn" title="Uzluksiz ovozli suhbat"
            class="shrink-0 w-10 h-10 rounded-xl flex items-center justify-center text-zinc-400
                   hover:text-cyan-300 hover:bg-white/[0.06] transition-all duration-200">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 11a9 9 0 0118 0v5a2 2 0 01-2 2h-1v-7h3M3 11v7h3v-7H3M6 18v1a2 2 0 002 2h2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button type="button" id="mic-btn" title="Ovozli kiritish"
            class="shrink-0 w-10 h-10 rounded-xl flex items-center justify-center text-zinc-400
                   hover:text-cyan-300 hover:bg-white/[0.06] transition-all duration-200">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
              <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8" stroke-linecap="round"/>
            </svg>
          </button>

          <textarea id="chat-input" rows="1" placeholder="Xabar yozing... (Xo'jayin)"
            class="flex-1 bg-transparent resize-none outline-none text-sm text-zinc-100
                   placeholder:text-zinc-500 py-2.5 max-h-40"></textarea>

          <button type="submit" id="send-btn" title="Yuborish"
            class="shrink-0 w-10 h-10 rounded-xl flex items-center justify-center
                   bg-cyan-500 hover:bg-cyan-400 text-[#09090b] transition-all duration-200
                   hover:shadow-[0_0_20px_rgba(6,182,212,0.4)] disabled:opacity-40 disabled:pointer-events-none">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
        <p id="voice-mode-status" hidden class="text-center text-[11px] text-cyan-300 mt-2">
          Ovozli suhbat rejimi yoqilgan — gapiring, JARVIS avtomatik tinglaydi va javob beradi
        </p>
        <p id="hint-text" class="text-center text-[11px] text-zinc-600 mt-2">
          Enter — yuborish, Shift+Enter — yangi qator
        </p>
      </div>
    </main>
  </div>

<script src="app.js"></script>
</body>
</html>
